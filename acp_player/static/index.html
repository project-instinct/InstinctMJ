<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACP · G1</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>ACP · G1</h1>

    <div class="field"><span class="field-label">数据集</span><div id="dataset"></div></div>
    <div class="field"><span class="field-label">分组</span><div id="group"></div></div>
    <div class="field"><span class="field-label">片段</span><div id="clip"></div></div>
    <div class="clip-path"><code id="clip-name">—</code><button id="copy-clip" title="复制片段名">复制</button></div>
    <div class="clip-group" id="clip-group">—</div>
    <div class="row">
      <button id="prev-clip" title="快捷键 [">上一段</button>
      <button id="next-clip" title="快捷键 ]">下一段</button>
    </div>
    <div class="field"><input id="filter" type="text" placeholder="搜索片段名 / 分组"></div>
    <p class="warn" id="load-error"></p>

    <section>
      <div id="review" class="review"></div>
      <textarea id="note" rows="2" placeholder="备注（保留 / 剔除时一起保存）"></textarea>
      <div class="row">
        <button id="keep" class="primary">保留</button>
        <button id="reject">剔除</button>
      </div>
      <div class="row">
        <button id="clear">清除决定</button>
        <button id="next-unreviewed">下一段未审阅</button>
      </div>
      <p class="muted" id="review-feedback"></p>
    </section>

    <section>
      <div id="status" class="status"></div>
      <div class="checks">
        <label class="inline"><input type="checkbox" id="play" checked> 播放 <kbd>空格</kbd></label>
        <label class="inline"><input type="checkbox" id="loop" checked> 循环</label>
      </div>
      <label class="range">速度 <input type="range" id="speed" min="0.25" max="2" step="0.25" value="1"><span id="speed-val">1×</span></label>
      <div class="row">
        <button id="prev">上一帧</button>
        <button id="next">下一帧</button>
      </div>
    </section>

    <details>
      <summary>显示</summary>
      <div class="checks">
        <label class="inline"><input type="checkbox" id="ov-contacts" checked> 参考接触</label>
        <label class="inline"><input type="checkbox" id="ov-physics" checked> 物理接触</label>
        <label class="inline"><input type="checkbox" id="ov-targets" checked> 下一接触目标</label>
        <label class="inline"><input type="checkbox" id="ov-trail" checked> 骨盆轨迹</label>
      </div>
      <div id="legend-colors" class="legend-colors"></div>
      <div id="legend-support" class="legend-colors">
        <span><i style="background:#3aa06a"></i>支撑</span>
        <span><i style="background:#e0574a"></i>失衡/悬空</span>
        <span><i style="background:#a86bd0"></i>腾空</span>
        <span><i style="background:#b9bfc7"></i>动态帧(不判)</span>
      </div>
    </details>

    <details>
      <summary>视角</summary>
      <label class="inline"><input type="checkbox" id="follow"> 跟随机器人</label>
      <div class="row">
        <button id="reset-view">重置视角</button>
        <button id="snap">对准机器人</button>
      </div>
      <p class="muted">左键拖动旋转，右键或 Shift 拖动平移，滚轮缩放。</p>
    </details>

  </aside>

  <main id="stage">
    <div id="viewport">
      <canvas id="view"></canvas>
    </div>
    <div id="dock-resize" title="上下拖动调整时间轴高度，双击恢复默认"><i></i></div>
    <div id="editbar">
      <button id="edit-toggle" title="快捷键 E">✎ 编辑接触</button>
      <div id="edit-parts" role="group" aria-label="接触部位"></div>
      <button id="edit-mark" title="在当前帧给所选部位添加接触；再点一次结束区间">＋ 接触</button>
      <button id="edit-erase" title="在当前帧擦除所选部位的接触；再点一次结束区间">－ 擦除</button>
      <button id="edit-undo" title="Ctrl+Z" disabled>撤销</button>
      <button id="edit-redo" title="Ctrl+Shift+Z" disabled>重做</button>
      <button id="edit-save" class="primary" disabled>保存</button>
      <button id="edit-revert" title="放弃未保存的修改" disabled>还原</button>
      <button id="edit-clear" title="删除已保存的手修，恢复原 sidecar" disabled>清除已保存</button>
      <span id="tl-zoom" class="zoom-group">
        <button id="tl-zoom-out" title="缩小时间轴（-）">−</button>
        <button id="tl-zoom-in" title="放大时间轴（+/=）">＋</button>
        <button id="tl-zoom-all" title="显示完整片段（0）">全览</button>
      </span>
      <span id="edit-status" class="edit-status">无改动</span>
      <span id="edit-hint" class="edit-hint"></span>
    </div>
    <div id="timeline" tabindex="0" aria-label="接触时间线：左右方向键逐帧，Shift+方向键 10 帧">
      <canvas id="strip"></canvas>
      <canvas id="cursor"></canvas>
    </div>
  </main>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
